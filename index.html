<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFD84D">
  <meta name="description" content="Una pequeña sorpresa hecha con HTML, CSS y JavaScript.">
  <title>Para ti, con mucho amor 🌼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="scene" class="scene" aria-label="Sorpresa animada">
    <!-- Pantalla inicial necesaria para permitir la reproducción de música -->
    <button id="startButton" class="start-screen" type="button" aria-label="Iniciar la sorpresa">
      <span class="start-sparkles" aria-hidden="true">✦ ✧ ✦</span>
      <span class="start-text">Toca si tu Ancient Si mete ulti al riki dx</span>
      <span class="start-subtext">♪</span>
    </button>

    <section id="yellowScene" class="yellow-scene">
      <div class="cloud cloud-1" aria-hidden="true"></div>
      <div class="cloud cloud-2" aria-hidden="true"></div>
      <div class="cloud cloud-3" aria-hidden="true"></div>
      <div class="cloud cloud-4" aria-hidden="true"></div>
      <div class="cloud cloud-5" aria-hidden="true"></div>
      <div class="cloud cloud-6" aria-hidden="true"></div>

      <div class="sparkle sparkle-1" aria-hidden="true"></div>
      <div class="sparkle sparkle-2" aria-hidden="true"></div>
      <div class="sparkle sparkle-3" aria-hidden="true"></div>
      <div class="sparkle sparkle-4" aria-hidden="true"></div>
      <div class="sparkle sparkle-5" aria-hidden="true"></div>
      <div class="sparkle sparkle-6" aria-hidden="true"></div>

      <div class="message">
        <div class="line-one">Dalia v0nita,Embecez lA bida</div>
        <div class="line-two">No ez kom0 keremoz</div>
        <div class="line-three">Pero te aseguro</div>
        <div class="love">QUE LO QUE SIENTO POR TI<br>SIGUE AQUÍ ❤️</div>
      </div>
    </section>

    <!-- La cortina amarilla baja de forma ondulada para revelar el ramo. -->
    <section id="flowerScene" class="flower-scene">
      <div class="flower-bg"></div>

      <div class="bouquet-wrap">
        <canvas id="bouquetCanvas" class="bouquet-canvas" width="544" height="750"
                aria-label="Ramo de flores dibujándose progresivamente"></canvas>
        <img id="bouquetSource" class="bouquet-source" src="assets/images/ramo.png"
             alt="" aria-hidden="true">
      </div>

      <div class="flower-message">
        <div class="flower-line line-a">UN RAMO</div>
        <div class="flower-line line-b">DE FLORES <br>🌻🌻🌻 </div>
        <div class="flower-line line-c">
          PORQUE SIGUES SIENDO<br>
          MUY ESPECIAL PARA MÍ (ya muy especial eres u.u)
        </div>
      </div>
    </section>

    <div id="musicControl" class="music-control" aria-hidden="true">
      <span class="music-note">♪</span>
    </div>

    <audio id="backgroundMusic" preload="auto" loop>
      <!-- Coloca tu canción en: assets/music/musica.mp3 -->
      <source src="assets/music/musica.mp3" type="audio/mpeg">
    </audio>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
